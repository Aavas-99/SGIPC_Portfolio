<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In | SGIPC</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="signin.css">
</head>
<body>

<header>
    <a class="logo" href="main.html">
        <img src="SGIPC.png" alt="SGIPC Logo">
        <h2>SGIPC</h2>
    </a>
    <nav>
        <a href="main.html#home">Home</a>
        <a href="main.html#about">About</a>
        <a href="committee.html">Committee</a>
        <a href="main.html#events">Events</a>
        <a href="main.html#contact">Contact</a>
    </nav>
</header>

<main>
    <div class="card">
        <h1>Welcome back</h1>
        <p class="sub">Don't have an account? <a href="signup.html">Sign up</a></p>

        <form onsubmit="handleSignin(event)">
            <div class="field">
                <label>Email</label>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="row">
                <label class="remember">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
    </div>
</main>

<footer>
    <p>&copy; <span id="year"></span> SGIPC | Built for programmers</p>
</footer>

<script src="signin.js"></script>

</body>
</html>
