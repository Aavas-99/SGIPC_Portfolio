<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | SGIPC</title>
    <link rel="icon" type="image/jpg" href="SGIPC.jpg">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
</head>
<body>

<header>
    <a class="logo" href="main.html">
        <img src="SGIPC.png" alt="SGIPC Logo">
        <h2>SGIPC</h2>
    </a>
    <nav>
        <a href="main.html#home">Home</a>
        <a href="main.html#about">About</a>
        <a href="committee.html">Committee</a>
        <a href="main.html#events">Events</a>
        <a href="main.html#achievements">Achievements</a>
        <a href="main.html#join">Join</a>
        <a href="main.html#contact">Contact</a>
    </nav>
</header>

<main>
    <div class="card">
        <h1>Create account</h1>
        <p class="sub">Already a member? <a href="signin.html">Sign in</a></p>

        <form onsubmit="handleSignup(event)">
            <div class="field">
                <label>Email</label>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a strong password" required oninput="checkStrength(this.value)">
                <div class="strength-bar">
                    <span id="s1"></span>
                    <span id="s2"></span>
                    <span id="s3"></span>
                    <span id="s4"></span>
                </div>
                <div class="strength-label" id="strength-label"></div>
            </div>

            <div class="field">
                <label>Confirm Password</label>
                <input type="password" id="confirm" placeholder="Repeat your password" required>
                <div class="err" id="pw-err">Passwords do not match.</div>
            </div>

            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
    </div>
</main>

<footer>
    <p>&copy; <span id="year"></span> SGIPC | Built for programmers</p>
</footer>

<script src="signup.js"></script>

</body>
</html>
